
name: AmneziaWG ABI diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  owr_branch: openwrt-24.10
  owr_commit: bb59922007043c0a0813d62b0d9f6e801caff9df

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GL configuration
        uses: actions/checkout@v4
        with:
          path: gl

      - name: Checkout AmneziaWG
        uses: actions/checkout@v4
        with:
          path: awg
          repository: amnezia-vpn/amneziawg-openwrt

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          path: owrt
          repository: openwrt/openwrt
          ref: ${{ env.owr_branch }}
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils kmod

      - name: Configure kernel
        run: |
          set -eu
          cd owrt
          git reset --hard "${{ env.owr_commit }}"
          mkdir -p package/awg
          cp -a ../awg/. package/awg/
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../gl/config_4.8.2.buildinfo .config
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          make defconfig

      - name: Build kernel and generate Module.symvers
        run: |
          set -eu
          cd owrt
          make tools/install
          make toolchain/install
          make target/linux/compile -j"$(nproc)" V=s
          find build_dir -name Module.symvers -type f -print

      - name: Extract AWG module
        run: |
          set -eu
          mkdir -p work/amnezia
          curl -fL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/AneziaWG_OpenWRT_v4.8.2/kmod-amneziawg_4.8.2.ipk" -o work/kmod-amneziawg.ipk
          sha256sum work/kmod-amneziawg.ipk > work/SHA256SUMS.txt
          gzip -dc work/kmod-amneziawg.ipk | tar -xf - -C work/amnezia
          tar -xzf work/amnezia/control.tar.gz -C work/amnezia
          tar -xzf work/amnezia/data.tar.gz -C work/amnezia
          MODULE="$(find work/amnezia -name amneziawg.ko -print -quit)"
          test -n "$MODULE"
          cp "$MODULE" work/amneziawg.ko
          {
            echo "=== MODULE INFO ==="
            modinfo work/amneziawg.ko || true
            echo "=== ELF HEADER ==="
            readelf -h work/amneziawg.ko
            echo "=== ELF SECTIONS ==="
            readelf -SW work/amneziawg.ko
            echo "=== IMPORTED SYMBOLS ==="
            nm -u work/amneziawg.ko | awk '{print $NF}' | sort -u
          } > work/amnezia-report.txt

      - name: Compare imports with Module.symvers
        run: |
          set -eu
          KERNEL="$(find owrt/build_dir -path '*/linux-*/linux-*/Module.symvers' -type f -print -quit)"
          test -n "$KERNEL"
          cp "$KERNEL" work/Module.symvers
          nm -u work/amneziawg.ko | awk '{print $NF}' | sort -u > work/imports.txt
          {
            echo "=== KERNEL REVISION ==="
            git -C owrt rev-parse HEAD
            echo "=== KERNEL CONFIG ==="
            find owrt/build_dir -path '*/linux-*/linux-*/.config' -type f -print -quit | while read f; do
              grep -E '^CONFIG_(MODVERSIONS|MODULE_REL_CRCS|IKCONFIG|IKCONFIG_PROC)=' "$f" || true
            done
            echo "=== EXPORTED SYMBOLS MATCHING AWG IMPORTS ==="
            awk 'NR==FNR {want[$1]=1; next} ($2 in want) {print $2, $1, $3, $4}' work/imports.txt work/Module.symvers | sort
            echo "=== IMPORTS MISSING FROM MODULE.SYMVERS ==="
            awk 'NR==FNR {want[$1]=1; next} ($2 in want) {found[$2]=1} END {for (s in want) if (!(s in found)) print s}' work/imports.txt work/Module.symvers | sort
            echo "=== ABI LIMITATION ==="
            echo "This is upstream OpenWrt Module.symvers, not the original GL.iNet vendor Module.symvers."
            echo "Matching exports here does not prove compatibility with the live vendor kernel."
          } > work/kernel-symbol-comparison.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-abi-diagnostics-v2
          path: |
            work/amneziawg.ko
            work/Module.symvers
            work/amnezia-report.txt
            work/kernel-symbol-comparison.txt
            work/SHA256SUMS.txt
          if-no-files-found: error
